        - "合成蓝宝石"
        - "人造蓝宝石"
        - "实验室蓝宝石"
    color: "#0f52ba"
    icon: "💙"

  # 海水珍珠 / Saltwater Pearl
  saltwater_pearl:
    name_zh: "海水珍珠"
    name_en: "Saltwater Pearl"
    keywords:
      english:
        - "saltwater pearl"
        - "akoya pearl"
        - "south sea pearl"
        - "tahitian pearl"
        - "sea pearl"
        - "marine pearl"
