# 价格区间配置 / Price Range Configuration
price_ranges:
  under_100:
    label_zh: "100美元以下"
    label_en: "Under $100"
    min: 0
    max: 100
  range_100_500:
    label_zh: "100-500美元"
    label_en: "$100 - $500"
    min: 100
    max: 500
  range_500_1000:
    label_zh: "500-1000美元"
    label_en: "$500 - $1000"
    min: 500
    max: 1000
  over_1000:
