# 宝石品类配置 / Gemstone Category Configuration
# 支持的宝石品类及搜索关键词

categories:
  # 培育钻石 / Lab-Grown Diamond
  lab_diamond:
    name_zh: "培育钻石"
    name_en: "Lab-Grown Diamond"
    keywords:
      english:
        - "lab grown diamond"
        - "lab created diamond"
        - "synthetic diamond"
        - "cultured diamond"
        - "cvd diamond"
        - "hpht diamond"
        - "man made diamond"
      chinese:
        - "培育钻石"
        - "合成钻石"
        - "人造钻石"
        - "实验室钻石"
        - "CVD钻石"
        - "HPHT钻石"
    color: "#b9f2ff"
    icon: "💎"

  # 培育祖母绿 / Lab-Grown Emerald
  lab_emerald:
    name_zh: "培育祖母绿"
    name_en: "Lab-Grown Emerald"
    keywords:
      english:
        - "lab grown emerald"
        - "cultured emerald"
        - "synthetic emerald"
        - "created emerald"
        - "hydrothermal emerald"
        - "man made emerald"
      chinese:
        - "培育祖母绿"
        - "合成祖母绿"
        - "人造祖母绿"
        - "实验室祖母绿"
        - "水热法祖母绿"
    color: "#50c878"
    icon: "💚"

  # 培育红宝石 / Lab-Grown Ruby
  lab_ruby:
    name_zh: "培育红宝石"
    name_en: "Lab-Grown Ruby"
    keywords:
      english:
        - "lab grown ruby"
        - "synthetic ruby"
        - "cultured ruby"
        - "created ruby"
        - "man made ruby"
        - "verneuil ruby"
      chinese:
        - "培育红宝石"
        - "合成红宝石"
        - "人造红宝石"
        - "实验室红宝石"
    color: "#e0115f"
    icon: "❤️"

  # 培育蓝宝石 / Lab-Grown Sapphire
  lab_sapphire:
    name_zh: "培育蓝宝石"
    name_en: "Lab-Grown Sapphire"
    keywords:
      english:
        - "lab grown sapphire"
        - "synthetic sapphire"
        - "cultured sapphire"
        - "created sapphire"
