services:
  - type: web
    name: diamond-scanner
    env: node
    region: tokyo
    buildCommand: npm install && npm run build
    startCommand: bash -c 'python3 -m pip --version 2>/dev/null || (python3 -c "import urllib.request; urllib.request.urlretrieve(\"https://bootstrap.pypa.io/get-pip.py\", \"/tmp/get-pip.py\")" && python3 /tmp/get-pip.py); python3 -m pip install --user Pillow; npm start'
    # 持久化存储 - 解决数据库丢失问题
    disk:
      name: diamond-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/data